name: iOS build

on:
  push:
    branches:
      - main
      - cursor/shifttrack-ios-app-0c12
  pull_request:
    branches:
      - main
      - cursor/shifttrack-ios-app-0c12

jobs:
  build:
    name: iPhone Simulator
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build ShiftTrack
        run: |
          xcodebuild build \
            -project ShiftTrack.xcodeproj \
            -scheme ShiftTrack \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
