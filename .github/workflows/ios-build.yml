name: iOS build

on:
  push:
    branches:
      - main
      - cursor/shifttrack-ios-app-0c12
  pull_request:
    branches:
      - main
      - cursor/shifttrack-ios-app-0c12

jobs:
  build:
    name: iPhone Simulator
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Build and test ShiftTrack
        run: |
          set -euo pipefail
          xcodebuild build \
            -project ShiftTrack.xcodeproj \
            -scheme ShiftTrack \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
          udid=$(python3 - <<'PY'
          import json, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          devices = []
          for runtime, rows in json.loads(raw).get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in rows:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPhone"):
                      devices.append(device["udid"])
          if not devices:
              raise SystemExit("no iPhone simulator")
          print(devices[-1])
          PY
          )
          rm -rf /tmp/shifttrack-shots
          mkdir -p /tmp/shifttrack-shots
          xcodebuild test \
            -project ShiftTrack.xcodeproj \
            -scheme ShiftTrack \
            -destination "id=${udid}" \
            -resultBundlePath "$RUNNER_TEMP/ShiftTrack.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload simulator result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-xcresult
          path: ${{ runner.temp }}/ShiftTrack.xcresult
          if-no-files-found: ignore

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/shifttrack-shots
          if-no-files-found: ignore

  ipad:
    name: iPad Simulator
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and test on iPad
        run: |
          set -euo pipefail
          udid=$(python3 - <<'PY'
          import json, subprocess
          raw = subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"], text=True)
          devices = []
          for runtime, rows in json.loads(raw).get("devices", {}).items():
              if "iOS" not in runtime:
                  continue
              for device in rows:
                  if device.get("isAvailable", True) and device.get("name", "").startswith("iPad"):
                      devices.append(device["udid"])
          if not devices:
              raise SystemExit("no iPad simulator")
          print(devices[-1])
          PY
          )
          rm -rf /tmp/shifttrack-shots
          mkdir -p /tmp/shifttrack-shots
          xcodebuild test \
            -project ShiftTrack.xcodeproj \
            -scheme ShiftTrack \
            -destination "id=${udid}" \
            -only-testing:ShiftTrackTests \
            -only-testing:ShiftTrackUITests/IPadShotUITests \
            -resultBundlePath "$RUNNER_TEMP/ShiftTrack-iPad.xcresult" \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload iPad screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots-ipad
          path: /tmp/shifttrack-shots
          if-no-files-found: ignore
